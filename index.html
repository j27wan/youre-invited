<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Birthday party invitation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="envelope-wrapper">
      <div id="envelope" class="close" role="button" tabindex="0" aria-label="Open birthday invitation" aria-expanded="false">
        <div class="front flap"></div>
        <div class="front pocket"></div>
        <div class="letter">
          <div class="words line2">You're invited...</div>
          <!-- <div class="words line3">to celebrate my 30th birthday!</div> -->
        </div>
        <div class="hearts">
          <div class="confetti a1"></div>
          <div class="confetti a2"></div>
          <div class="confetti a3"></div>
          <div class="confetti a4"></div>
          <div class="confetti a5"></div>
        </div>
      </div>
    </div>
    <main id="invitation" class="invitation" aria-hidden="true">
      <div class="invitation-card">
        <p class="eyebrow">Save the date</p>
        <h1>Birthday<br /><span>celebration</span></h1>
        <p class="invitation-intro">A little party, a lot of cake, and the people who make life worth celebrating.</p>
        <div class="event-details">
          <div>
            <span class="detail-label">When</span>
            <strong>Saturday, June 15</strong>
            <span>4:00 PM onwards</span>
          </div>
          <div>
            <span class="detail-label">Where</span>
            <strong>The Garden Room</strong>
            <span>123 Celebration Lane</span>
          </div>
        </div>
        <p class="rsvp-note">Come dressed for joy. RSVP by June 1.</p>
        <button id="rsvp-button" class="rsvp-button" type="button">Count me in</button>
      </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
