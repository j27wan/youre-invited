<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Birthday party invitation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Carattere&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="envelope-wrapper">
      <div id="envelope" class="close" role="button" tabindex="0" aria-label="Open birthday invitation" aria-expanded="false">
        <div class="front flap"></div>
        <div class="front pocket"></div>
        <div class="letter">
          <div class="words line2">Dear Guest,</div>
          <div class="words line3">You're invited to celebrate...</div>
        </div>
        <div class="hearts">
          <div class="confetti a1"></div>
          <div class="confetti a2"></div>
          <div class="confetti a3"></div>
          <div class="confetti a4"></div>
          <div class="confetti a5"></div>
        </div>
      </div>
    </div>
    <main id="invitation" class="invitation" aria-hidden="true">
      <div class="invitation-layout">
        <img class="invitation-image" src="invite.svg" alt="Birthday party invitation" />
        <div class="invitation-actions">
          <div class="rsvp-control">
            <a class="rsvp-link" href="https://partiful.com/events/" aria-label="Go to the RSVP page">
              <img src="rsvp.jpeg" alt="RSVP" />
            </a>
            <span class="rsvp-label">rsvp</span>
          </div>
          <div class="spotify-control">
            <a class="spotify-link" href="https://open.spotify.com/" aria-label="Open the Spotify playlist">
              <img src="vinyl.svg" alt="Spotify playlist" />
            </a>
            <span class="spotify-label">song requests</span>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
