<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Birthday party invitation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Carattere&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="envelope-wrapper">
      <div id="envelope" class="close" role="button" tabindex="0" aria-label="Open birthday invitation" aria-expanded="false">
        <div class="front flap"></div>
        <div class="front pocket"></div>
        <div class="letter">
          <div class="words line">Dear Guest,</div>
        </div>
        <div class="confetti-container">
          <div class="confetti a1"></div>
          <div class="confetti a2"></div>
          <div class="confetti a3"></div>
          <div class="confetti a4"></div>
          <div class="confetti a5"></div>
        </div>
      </div>
    </div>
    <main id="invitation" class="invitation" aria-hidden="true">
      <div class="invitation-layout">
        <button class="invitation-zoom" type="button" aria-label="View invitation larger">
          <img class="invitation-image" src="invite.png" alt="Birthday party invitation" />
        </button>
        <div class="invitation-actions">
          <div class="rsvp-control">
            <a class="rsvp-link" href="https://partiful.com/e/xofQzETdqb0BGZr73idT" target="_blank" rel="noopener noreferrer" aria-label="Go to the RSVP page">
              <img src="rsvp.png" alt="RSVP" />
            </a>
            <span class="rsvp-label">rsvp</span>
          </div>
          <div class="venue-control">
            <a class="venue-link" href="https://www.google.com/maps/place/P%C3%9ARL+Barbican/@51.5205556,-0.1006305,17z/data=!3m1!4b1!4m6!3m5!1s0x48761bf60373f855:0xc0ab919cf98aa048!8m2!3d51.5205556!4d-0.0980556!16s%2Fg%2F11ms7d8zxk" target="_blank" rel="noopener noreferrer" aria-label="Open the venue location">
              <img src="venue.png" alt="Venue" />
            </a>
            <span class="venue-label">venue</span>
          </div>
          <div class="spotify-control">
            <a class="spotify-link" href="https://open.spotify.com/playlist/0o79EeUhriAtnJVMAKlaz8?si=aab25e86131a46db&pt=e0f8520f76dee142ecedc3741c4094bd" target="_blank" rel="noopener noreferrer" aria-label="Open the Spotify playlist">
              <img src="vinyl.svg" alt="Spotify playlist" />
            </a>
            <span class="spotify-label">song requests</span>
          </div>
        </div>
      </div>
    </main>
    <div id="image-modal" class="image-modal" hidden>
      <button class="image-modal-close" type="button" aria-label="Close enlarged invitation">Close</button>
      <img src="invite.png" alt="Birthday party invitation enlarged" />
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
